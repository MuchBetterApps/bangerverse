<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>Banger Pulse alert</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="toast.css"></head>
<body><article class="toast"><div class="toast-header"><span class="toast-brand"><img src="assets/banger.svg" alt="Banger"> <span>pulse</span></span><span id="kind">ONE-TIME CODE</span><button id="dismiss" class="icon-button" aria-label="Dismiss alert"><i data-icon="x"></i></button></div><strong id="title" class="alert-title"></strong><p id="body" class="alert-body"></p><div id="code" class="otp-code" hidden></div><div class="alert-actions"><button id="copy" class="copy-button" hidden><i data-icon="copy"></i> Copy code</button><button id="open" class="open-button">Open email <i data-icon="arrow-up-right"></i></button></div><p id="toast-error" role="status" hidden></p></article><script type="module" src="toast.js"></script></body></html>
