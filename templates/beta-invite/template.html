<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light"><title>{{brand.company_name}}</title>{{brand.font_head}}<style>@media (max-width:620px){.stack{display:block!important;width:100%!important;max-width:100%!important;padding-left:0!important;padding-right:0!important}.px{padding-left:24px!important;padding-right:24px!important}.inset{padding-left:12px!important;padding-right:12px!important}.hero{font-size:36px!important;line-height:1.08!important}.giant{font-size:60px!important}.hide-sm{display:none!important} }</style></head>
<body style="margin:0;padding:0;background:{{brand.s_canvas}};color:{{brand.background_text_color}};font-family:{{brand.body_font_family}};-webkit-font-smoothing:antialiased">
<div style="display:none;max-height:0;overflow:hidden;font-size:1px;line-height:1px;color:{{brand.s_canvas}}">{{preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_canvas}}" style="background:{{brand.s_canvas}}"><tr><td align="center" style="padding:24px 12px 32px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_card_bg}}" style="max-width:600px;background:{{brand.s_card_bg}};border-radius:{{brand.s_card_radius}}px;border:{{brand.s_card_border}}"><tr><td class="px" align="{{brand.s_align}}" bgcolor="{{brand.band_color}}" style="padding:30px {{brand.s_pad_x}}px 30px;text-align:{{brand.s_align}};background:{{brand.band_color}};border-radius:{{brand.s_card_radius}}px {{brand.s_card_radius}}px 0 0;font-size:16px;line-height:1.6">{{brand.band_logo_block}}<div style="height:22px;line-height:22px;font-size:1px">&nbsp;</div><p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:{{brand.s_eyebrow_tracking}};text-transform:{{brand.s_eyebrow_case}};color:{{brand.on_band_muted_color}};text-align:{{brand.s_align}}">Early access</p><h1 class="hero" style="margin:0 0 8px;font-family:{{brand.heading_font_family}};font-size:{{brand.s_hero_size}}px;line-height:{{brand.s_head_lh}};letter-spacing:{{brand.s_head_tracking}};font-weight:{{brand.heading_weight}};text-transform:{{brand.s_head_case}};color:{{brand.on_band_color}};text-align:{{brand.s_align}}">You're in, {{first_name|there}}.</h1><p style="margin:0 0 0px;font-size:17px;line-height:1.6;color:{{brand.on_band_color}};text-align:{{brand.s_align}}">{{summary}}</p></td></tr><tr><td style="padding:0 32px"><div style="border-top:2px dashed {{brand.line_color}};height:1px;line-height:1px;font-size:1px">&nbsp;</div></td></tr><tr><td class="px" align="{{brand.s_align}}" style="padding:26px {{brand.s_pad_x}}px 32px;text-align:{{brand.s_align}};font-size:16px;line-height:1.6"><p style="margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:{{brand.muted_text_color}}">Your invite code</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_panel_bg}}" style="background:{{brand.s_panel_bg}};border-radius:14px"><tr><td align="center" style="padding:20px 16px;color:{{brand.s_panel_text_color}};font-size:15px;line-height:1.55"><p style="margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:34px;font-weight:700;letter-spacing:.3em;text-align:center">{{code}}</p></td></tr></table><div style="height:18px;line-height:18px;font-size:1px">&nbsp;</div><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:6px 0 20px"><tr><td align="{{brand.s_align}}" style="text-align:{{brand.s_align}}"><table role="presentation" cellspacing="0" cellpadding="0" width="100%" style="display:inline-table"><tr><td bgcolor="{{brand.s_btn_bg}}" align="center" style="border-radius:{{brand.s_btn_radius}}px;background:{{brand.s_btn_bg}};border:{{brand.s_btn_border}}"><a href="{{cta_url}}" style="display:block;padding:{{brand.s_btn_pad}};font-size:{{brand.s_btn_size}}px;font-weight:700;letter-spacing:{{brand.s_btn_tracking}};text-transform:{{brand.s_btn_case}};line-height:1.2;color:{{brand.s_btn_fg}};text-decoration:none;border-radius:{{brand.s_btn_radius}}px">{{cta_label}}</a></td></tr></table></td></tr></table><p style="margin:0 0 0px;font-size:14px;line-height:1.6;color:{{brand.muted_text_color}};text-align:center">The code works once and expires on <strong>{{expires_on}}</strong>. After that it goes to the next person on the list.</p></td></tr></table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px"><tr><td style="padding:22px 32px 0;font-size:12px;line-height:1.6;color:{{brand.footer_text_color}};text-align:center">{{brand.footer_block}}</td></tr></table>
</td></tr></table>
</body></html>
