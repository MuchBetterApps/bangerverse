<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light"><title>{{brand.company_name}}</title>{{brand.font_head}}<style>@media (max-width:620px){.stack{display:block!important;width:100%!important;max-width:100%!important;padding-left:0!important;padding-right:0!important}.px{padding-left:24px!important;padding-right:24px!important}.inset{padding-left:12px!important;padding-right:12px!important}.hero{font-size:36px!important;line-height:1.08!important}.giant{font-size:60px!important}.hide-sm{display:none!important} }</style></head>
<body style="margin:0;padding:0;background:{{brand.s_canvas}};color:{{brand.background_text_color}};font-family:{{brand.body_font_family}};-webkit-font-smoothing:antialiased">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_canvas}}" style="background:{{brand.s_canvas}}"><tr><td align="center" style="padding:24px 12px 32px">

p class="giant" style="margin:0 0 6px;font-family:{{brand.heading_font_family}};font-size:68px;line-height:1;font-weight:{{brand.heading_weight}};letter-spacing:-.035em;color:{{brand.on_accent_color}};text-align:{{brand.s_align}}">{{stat_1}}</p><p style="margin:8px 0 0;font-size:16px;color:{{brand.on_accent_color}}">{{stat_1_note}}</p></td></tr><tr><td class="px" align="{{brand.s_align}}" bgcolor="{{brand.primary_tint_color}}" style="padding:30px {{brand.s_pad_x}}px;text-align:{{brand.s_align}};background:{{brand.primary_tint_color}};color:{{brand.on_primary_tint_color}};font-size:16px;line-height:1.6"><p style="margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:{{brand.on_primary_tint_color}}">{{stat_2_label}}</p><p class="giant" style="margin:0 0 6px;font-family:{{brand.heading_font_family}};font-size:68px;line-height:1;font-weight:{{brand.heading_weight}};letter-spacing:-.035em;color:{{brand.on_primary_tint_color}};text-align:{{brand.s_align}}">{{stat_2}}</p><p style="margin:8px 0 0;font-size:16px;color:{{brand.on_primary_tint_color}}">{{stat_2_note}}</p></td></tr><tr><td class="px" align="{{brand.s_align}}" bgcolor="{{brand.dark_surface_color}}" style="padding:30px {{brand.s_pad_x}}px;text-align:{{brand.s_align}};background:{{brand.dark_surface_color}};color:{{brand.on_dark_color}};font-size:16px;line-height:1.6"><p style="margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:{{brand.on_dark_color}}">{{stat_3_label}}</p><p class="giant" style="margin:0 0 6px;font-family:{{brand.heading_font_family}};font-size:68px;line-height:1;font-weight:{{brand.heading_weight}};letter-spacing:-.035em;color:{{brand.on_dark_color}};text-align:{{brand.s_align}}">{{stat_3}}</p><p style="margin:8px 0 0;font-size:16px;color:{{brand.on_dark_color}}">{{stat_3_note}}</p></td></tr><tr><td class="px" align="{{brand.s_align}}" style="padding:30px {{brand.s_pad_x}}px 34px;text-align:{{brand.s_align}};font-size:16px;line-height:1.6"><p style="margin:0 0 16px;font-size:17px;line-height:1.6;color:inherit;text-align:{{brand.s_align}}">{{thanks}}</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:6px 0 20px"><tr><td align="{{brand.s_align}}" style="text-align:{{brand.s_align}}"><table role="presentation" cellspacing="0" cellpadding="0" style="display:inline-table"><tr><td bgcolor="{{brand.s_btn_bg}}" align="center" style="border-radius:{{brand.s_btn_radius}}px;background:{{brand.s_btn_bg}};border:{{brand.s_btn_border}}"><a href="{{cta_url}}" style="display:inline-block;padding:{{brand.s_btn_pad}};font-size:{{brand.s_btn_size}}px;font-weight:700;letter-spacing:{{brand.s_btn_tracking}};text-transform:{{brand.s_btn_case}};line-height:1.2;color:{{brand.s_btn_fg}};text-decoration:none;border-radius:{{brand.s_btn_radius}}px">{{cta_label}}</a></td></tr></table></td></tr></table></td></tr></table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px"><tr><td style="padding:22px 32px 0;font-size:12px;line-height:1.6;color:{{brand.footer_text_color}};text-align:center">{{brand.footer_block}}</td></tr></table>
</td></tr></table>
</body></html>
