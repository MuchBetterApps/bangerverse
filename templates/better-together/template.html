weight:{{brand.heading_weight}};text-transform:{{brand.s_head_case}};color:inherit;text-align:{{brand.s_align}}">Who else should see {{project_name}}?</h1><p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:inherit;text-align:{{brand.s_align}}">{{summary}}</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:6px 0 20px"><tr><td align="{{brand.s_align}}" style="text-align:{{brand.s_align}}"><table role="presentation" cellspacing="0" cellpadding="0" style="display:inline-table"><tr><td bgcolor="{{brand.s_btn_bg}}" align="center" style="border-radius:{{brand.s_btn_radius}}px;background:{{brand.s_btn_bg}};border:{{brand.s_btn_border}}"><a href="{{cta_url}}" style="display:inline-block;padding:{{brand.s_btn_pad}};font-size:{{brand.s_btn_size}}px;font-weight:700;letter-spacing:{{brand.s_btn_tracking}};text-transform:{{brand.s_btn_case}};line-height:1.2;color:{{brand.s_btn_fg}};text-decoration:none;border-radius:{{brand.s_btn_radius}}px">{{cta_label}}</a></td></tr></table></td></tr></table><p style="margin:0 0 0px;font-size:14px;line-height:1.6;color:{{brand.muted_text_color}};text-align:{{brand.s_align}}">They'll get a personal invite from you. Free on every plan.</p></td></tr></table>
