<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light"><title>{{brand.company_name}}</title>{{brand.font_head}}<style>@media (max-width:620px){.stack{display:block!important;width:100%!important;max-width:100%!important;padding-left:0!important;padding-right:0!important}.px{padding-left:24px!important;padding-right:24px!important}.inset{padding-left:12px!important;padding-right:12px!important}.hero{font-size:36px!important;line-height:1.08!important}.giant{font-size:60px!important}.hide-sm{display:none!important} }</style></head>
<body style="margin:0;padding:0;background:{{brand.surface_color}};color:{{brand.text_color}};font-family:{{brand.body_font_family}};-webkit-font-smoothing:antialiased">
<div style="display:none;max-height:0;overflow:hidden;font-size:1px;line-height:1px;color:{{brand.surface_color}}">{{preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.surface_color}}" style="background:{{brand.surface_color}}"><tr><td align="center" style="padding:24px 12px 32px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:580px"><tr><td class="px" style="padding:12px 24px 0;font-family:{{brand.heading_font_family}};font-size:18px;line-height:1.7;color:{{brand.text_color}}">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="{{brand.s_logo_align}}" style="text-align:{{brand.s_logo_align}};border-bottom:{{brand.s_masthead_rule}};padding-bottom:{{brand.s_masthead_pad}}px"><div style="display:inline-block">{{brand.logo_block}}</div></td></tr></table><div style="height:26px;line-height:26px;font-size:1px">&nbsp;</div><p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:{{brand.s_eyebrow_tracking}};text-transform:{{brand.s_eyebrow_case}};color:{{brand.muted_text_color}};text-align:{{brand.s_align}}">{{kicker}}</p><h1 style="margin:0 0 14px;font-family:{{brand.heading_font_family}};font-size:{{brand.s_title_size}}px;line-height:{{brand.s_head_lh}};letter-spacing:{{brand.s_head_tracking}};font-weight:400;text-transform:{{brand.s_head_case}};color:inherit;text-align:{{brand.s_align}}">{{title}}</h1>
<p style="margin:0 0 16px;font-size:18px;line-height:1.7;color:inherit;text-align:{{brand.s_align}}">Hi {{first_name|there}},</p>
<p style="margin:0 0 16px;font-size:18px;line-height:1.7;color:inherit;text-align:{{brand.s_align}}">{{paragraph_1}}</p>
<p style="margin:0 0 16px;font-size:18px;line-height:1.7;color:inherit;text-align:{{brand.s_align}}">{{paragraph_2}}</p>
<div style="text-align:left"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 20px"><tr><td style="border-left:4px solid {{brand.accent_color}};padding:4px 0 4px 20px"><p style="margin:0 0 10px;font-family:{{brand.heading_font_family}};font-size:24px;line-height:1.35;font-style:italic">{{pull_quote}}</p></td></tr></table></div>
<p style="margin:0 0 16px;font-size:18px;line-height:1.7;color:inherit;text-align:{{brand.s_align}}">{{paragraph_3}}</p>
<p style="margin:0 0 16px;font-size:18px;line-height:1.7;color:inherit;text-align:{{brand.s_align}}">{{closing}} <a href="{{cta_url}}" style="color:{{brand.primary_text_color}};font-weight:700;text-decoration:none">{{link_label}}&nbsp;→</a></p>
<div style="height:10px;line-height:10px;font-size:1px">&nbsp;</div><table role="presentation" cellspacing="0" cellpadding="0"><tr><td valign="middle"><table role="presentation" cellspacing="0" cellpadding="0"><tr><td width="44" height="44" align="center" valign="middle" bgcolor="{{brand.primary_color}}" style="width:44px;height:44px;border-radius:50%;background:{{brand.primary_color}};color:{{brand.on_primary_color}};font-family:{{brand.heading_font_family}};font-weight:700;font-size:17px;line-height:1">{{sender_initials}}</td></tr></table></td><td valign="middle" style="padding-left:14px;font-size:15px;line-height:1.4"><strong>{{sender_name}}</strong><br><span style="color:{{brand.muted_text_color}}">{{sender_role}}</span></td></tr></table>
</td></tr></table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:580px"><tr><td style="padding:22px 32px 0;font-size:12px;line-height:1.6;color:{{brand.muted_text_color}};text-align:center">{{brand.footer_block}}</td></tr></table>
</td></tr></table>
</body></html>
