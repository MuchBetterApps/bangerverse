<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light"><title>{{brand.company_name}}</title>{{brand.font_head}}<style>@media (max-width:620px){.stack{display:block!important;width:100%!important;max-width:100%!important;padding-left:0!important;padding-right:0!important}.px{padding-left:24px!important;padding-right:24px!important}.inset{padding-left:12px!important;padding-right:12px!important}.hero{font-size:36px!important;line-height:1.08!important}.giant{font-size:60px!important}.hide-sm{display:none!important} }</style></head>
<body style="margin:0;padding:0;background:{{brand.dark_background_color}};color:{{brand.on_dark_color}};font-family:{{brand.body_font_family}};-webkit-font-smoothing:antialiased">
<div style="display:none;max-height:0;overflow:hidden;font-size:1px;line-height:1px;color:{{brand.dark_background_color}}">{{preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.dark_background_color}}" style="background:{{brand.dark_background_color}}"><tr><td align="center" style="padding:24px 12px 32px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.dark_surface_color}}" style="max-width:600px;background:{{brand.dark_surface_color}};border-radius:{{brand.s_card_radius}}px;border:{{brand.s_card_border}}"><tr><td class="px" align="{{brand.s_align}}" style="padding:28px 40px 0;text-align:{{brand.s_align}};font-size:16px;line-height:1.6">{{brand.dark_logo_block}}</td></tr><tr><td class="px" align="{{brand.s_align}}" style="padding:24px {{brand.s_pad_x}}px 22px;text-align:{{brand.s_align}};font-size:16px;line-height:1.6"><p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:{{brand.s_eyebrow_tracking}};text-transform:{{brand.s_eyebrow_case}};color:{{brand.accent_on_dark_color}};text-align:{{brand.s_align}}">{{eyebrow}}</p><h1 class="hero" style="margin:0 0 14px;font-family:{{brand.heading_font_family}};font-size:{{brand.s_hero_size}}px;line-height:{{brand.s_head_lh}};letter-spacing:-.025em;font-weight:{{brand.heading_weight}};text-transform:{{brand.s_head_case}};color:{{brand.on_dark_color}};text-align:{{brand.s_align}}">{{offer_headline}}</h1><p style="margin:0 0 16px;font-size:18px;line-height:1.6;color:{{brand.on_dark_muted_color}};text-align:{{brand.s_align}}">{{offer_detail}}</p></td></tr><tr><td class="inset" style="padding:0 {{brand.s_image_inset}}px;line-height:0;font-size:0"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td bgcolor="{{brand.dark_surface_color}}" style="background:{{brand.dark_surface_color}};border-radius:{{brand.s_image_radius}}px;line-height:0"><img src="{{hero_image}}" width="600" height="240" alt="" style="display:block;width:100%;max-width:600px;height:auto;border:0;outline:none;text-decoration:none;background:{{brand.primary_tint_color}};color:{{brand.muted_text_color}};font-size:13px;border-radius:{{brand.s_image_radius}}px"></td></tr></table></td></tr><tr><td class="px" align="{{brand.s_align}}" style="padding:28px {{brand.s_pad_x}}px 32px;text-align:{{brand.s_align}};font-size:16px;line-height:1.6"><p style="margin:0 0 4px;font-size:15px;color:{{brand.on_dark_muted_color}}"><s>{{anchor_price}}</s></p><p style="margin:0 0 20px;font-family:{{brand.heading_font_family}};font-size:34px;font-weight:700;color:{{brand.on_dark_color}}">{{offer_price}}</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:6px 0 20px"><tr><td align="{{brand.s_align}}" style="text-align:{{brand.s_align}}"><table role="presentation" cellspacing="0" cellpadding="0" style="display:inline-table"><tr><td bgcolor="{{brand.accent_color}}" align="center" style="border-radius:{{brand.s_btn_radius}}px;background:{{brand.accent_color}};border:0"><a href="{{cta_url}}" style="display:inline-block;padding:{{brand.s_btn_pad}};font-size:{{brand.s_btn_size}}px;font-weight:700;letter-spacing:{{brand.s_btn_tracking}};text-transform:{{brand.s_btn_case}};line-height:1.2;color:{{brand.on_accent_color}};text-decoration:none;border-radius:{{brand.s_btn_radius}}px">{{cta_label}}</a></td></tr></table></td></tr></table><p style="margin:0 0 0px;font-size:14px;line-height:1.6;color:{{brand.on_dark_muted_color}};text-align:{{brand.s_align}}">Ends <strong>{{deadline}}</strong>.</p></td></tr></table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px"><tr><td style="padding:22px 32px 0;font-size:12px;line-height:1.6;color:{{brand.on_dark_muted_color}};text-align:center">{{brand.footer_block}}</td></tr></table>
</td></tr></table>
</body></html>
