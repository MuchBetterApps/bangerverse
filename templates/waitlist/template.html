<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light"><title>{{brand.company_name}}</title>{{brand.font_head}}<style>@media (max-width:620px){.stack{display:block!important;width:100%!important;max-width:100%!important;padding-left:0!important;padding-right:0!important}.px{padding-left:24px!important;padding-right:24px!important}.inset{padding-left:12px!important;padding-right:12px!important}.hero{font-size:36px!important;line-height:1.08!important}.giant{font-size:60px!important}.hide-sm{display:none!important} }</style></head>
<body style="margin:0;padding:0;background:{{brand.s_canvas}};color:{{brand.background_text_color}};font-family:{{brand.body_font_family}};-webkit-font-smoothing:antialiased">
<div style="display:none;max-height:0;overflow:hidden;font-size:1px;line-height:1px;color:{{brand.s_canvas}}">{{preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_canvas}}" style="background:{{brand.s_canvas}}"><tr><td align="center" style="padding:24px 12px 32px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_card_bg}}" style="max-width:600px;background:{{brand.s_card_bg}};border-radius:{{brand.s_card_radius}}px;border:{{brand.s_card_border}}"><tr><td class="px" align="center" style="padding:26px 40px 0;text-align:center;font-size:16px;line-height:1.6"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="{{brand.s_logo_align}}" style="text-align:{{brand.s_logo_align}};border-bottom:{{brand.s_masthead_rule}};padding-bottom:{{brand.s_masthead_pad}}px"><div style="display:inline-block">{{brand.logo_block}}</div></td></tr></table></td></tr><tr><td class="px" align="center" style="padding:26px {{brand.s_pad_x}}px 36px;text-align:center;font-size:16px;line-height:1.6"><p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:{{brand.s_eyebrow_tracking}};text-transform:{{brand.s_eyebrow_case}};color:{{brand.accent_text_color}};text-align:center">You're on the list</p><p class="giant" style="margin:0 0 6px;font-family:{{brand.heading_font_family}};font-size:92px;line-height:1;font-weight:{{brand.heading_weight}};letter-spacing:-.035em;color:{{brand.primary_text_color}};text-align:center">#{{position}}</p><p style="margin:0 0 26px;font-size:16px;line-height:1.6;color:{{brand.muted_text_color}};text-align:center">{{summary}}</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_panel_bg}}" style="background:{{brand.s_panel_bg}};border-radius:{{brand.s_panel_radius}}px"><tr><td align="center" style="padding:22px 24px;color:{{brand.s_panel_text_color}};font-size:15px;line-height:1.55"><p style="margin:0 0 4px;font-size:18px;font-weight:700;font-family:{{brand.heading_font_family}}">{{referral_offer}}</p><p style="margin:0 0 14px;font-size:14px;color:{{brand.s_panel_muted_color}}">{{referral_detail}}</p><table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.surface_color}}" style="background:{{brand.surface_color}};border:1px dashed {{brand.line_color}};border-radius:10px"><tr><td align="center" style="padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:700;letter-spacing:.06em;color:{{brand.text_color}}">{{referral_link}}</td></tr></table><div style="height:14px;line-height:14px;font-size:1px">&nbsp;</div><table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:6px 0 20px"><tr><td align="center" style="text-align:center"><table role="presentation" cellspacing="0" cellpadding="0" style="display:inline-table"><tr><td bgcolor="{{brand.s_btn_bg}}" align="center" style="border-radius:{{brand.s_btn_radius}}px;background:{{brand.s_btn_bg}};border:{{brand.s_btn_border}}"><a href="{{cta_url}}" style="display:inline-block;padding:{{brand.s_btn_pad}};font-size:{{brand.s_btn_size}}px;font-weight:700;letter-spacing:{{brand.s_btn_tracking}};text-transform:{{brand.s_btn_case}};line-height:1.2;color:{{brand.s_btn_fg}};text-decoration:none;border-radius:{{brand.s_btn_radius}}px">{{cta_label}}</a></td></tr></table></td></tr></table></td></tr></table></td></tr></table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px"><tr><td style="padding:22px 32px 0;font-size:12px;line-height:1.6;color:{{brand.footer_text_color}};text-align:center">{{brand.footer_block}}</td></tr></table>
</td></tr></table>
</body></html>
