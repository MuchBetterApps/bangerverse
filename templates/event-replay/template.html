<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light"><title>{{brand.company_name}}</title>{{brand.font_head}}<style>@media (max-width:620px){.stack{display:block!important;width:100%!important;max-width:100%!important;padding-left:0!important;padding-right:0!important}.px{padding-left:24px!important;padding-right:24px!important}.inset{padding-left:12px!important;padding-right:12px!important}.hero{font-size:36px!important;line-height:1.08!important}.giant{font-size:60px!important}.hide-sm{display:none!important} }</style></head>
<body style="margin:0;padding:0;background:{{brand.s_canvas}};color:{{brand.background_text_color}};font-family:{{brand.body_font_family}};-webkit-font-smoothing:antialiased">
<div style="display:none;max-height:0;overflow:hidden;font-size:1px;line-height:1px;color:{{brand.s_canvas}}">{{preheader}}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_canvas}}" style="background:{{brand.s_canvas}}"><tr><td align="center" style="padding:24px 12px 32px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_card_bg}}" style="max-width:600px;background:{{brand.s_card_bg}};border-radius:{{brand.s_card_radius}}px;border:{{brand.s_card_border}}"><tr><td class="px" align="{{brand.s_align}}" style="padding:26px {{brand.s_pad_x}}px 18px;text-align:{{brand.s_align}};font-size:16px;line-height:1.6"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td align="{{brand.s_logo_align}}" style="text-align:{{brand.s_logo_align}};border-bottom:{{brand.s_masthead_rule}};padding-bottom:{{brand.s_masthead_pad}}px"><div style="display:inline-block">{{brand.logo_block}}</div></td></tr></table></td></tr><tr><td bgcolor="{{brand.band_color}}" style="background:{{brand.band_color}};line-height:0"><a href="{{cta_url}}" style="display:block;position:relative;text-decoration:none"><table role="presentation" width="100%" cellspacing="0" cellpadding="0"><tr><td style="line-height:0"><img src="{{video_thumbnail}}" width="600" alt="Play the replay" style="display:block;width:100%;max-width:600px;height:auto;border:0;outline:none;text-decoration:none;background:{{brand.primary_tint_color}};color:{{brand.muted_text_color}};font-size:13px"></td></tr><tr><td align="center" bgcolor="{{brand.band_color}}" style="background:{{brand.band_color}};padding:12px;font-size:15px;font-weight:700;color:{{brand.on_band_color}};line-height:1.2">▶&nbsp; {{cta_label}} · {{length}}</td></tr></table></a></td></tr><tr><td class="px" align="{{brand.s_align}}" style="padding:26px {{brand.s_pad_x}}px 34px;text-align:{{brand.s_align}};font-size:16px;line-height:1.6"><p style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:{{brand.s_eyebrow_tracking}};text-transform:{{brand.s_eyebrow_case}};color:{{brand.muted_text_color}};text-align:{{brand.s_align}}">Replay</p><h1 style="margin:0 0 14px;font-family:{{brand.heading_font_family}};font-size:{{brand.s_title_size}}px;line-height:{{brand.s_head_lh}};letter-spacing:{{brand.s_head_tracking}};font-weight:{{brand.heading_weight}};text-transform:{{brand.s_head_case}};color:inherit;text-align:{{brand.s_align}}">{{event_name}}</h1><h2 style="margin:0 0 10px;font-family:{{brand.heading_font_family}};font-size:18px;line-height:1.25;font-weight:{{brand.heading_weight}};color:inherit">Three takeaways</h2><ul style="margin:0 0 20px;padding-left:18px;font-size:15px;line-height:1.6"><li style="margin:0 0 8px">{{takeaway_1}}</li><li style="margin:0 0 8px">{{takeaway_2}}</li><li style="margin:0 0 8px">{{takeaway_3}}</li></ul><table role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{brand.s_panel_bg}}" style="background:{{brand.s_panel_bg}};border-radius:{{brand.s_panel_radius}}px"><tr><td align="left" style="padding:14px 18px;color:{{brand.s_panel_text_color}};font-size:15px;line-height:1.55"><p style="margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:{{brand.s_panel_muted_color}}">Jump to</p>{{timestamps}}</td></tr></table></td></tr></table>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px"><tr><td style="padding:22px 32px 0;font-size:12px;line-height:1.6;color:{{brand.footer_text_color}};text-align:center">{{brand.footer_block}}</td></tr></table>
</td></tr></table>
</body></html>
